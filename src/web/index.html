<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>企业内部知识库问答</title>
    <style>
        :root {
            --primary: #4f6ef7;
            --bg: #f5f6fa;
            --user-bubble: #4f6ef7;
            --bot-bubble: #ffffff;
            --text: #1f2329;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 720px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #fff;
            box-shadow: 0 8px 40px rgba(0,0,0,0.08);
        }
        .header {
            padding: 18px 24px;
            background: var(--primary);
            color: #fff;
            font-size: 18px;
            font-weight: 600;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .msg {
            max-width: 78%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .msg.user {
            align-self: flex-end;
            background: var(--user-bubble);
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .msg.bot {
            align-self: flex-start;
            background: var(--bot-bubble);
            color: var(--text);
            border: 1px solid #ececf1;
            border-bottom-left-radius: 4px;
        }
        .msg .sources {
            margin-top: 8px;
            font-size: 12px;
            color: #8a8f99;
        }
        .input-area {
            display: flex;
            padding: 14px 16px;
            border-top: 1px solid #ececf1;
            gap: 10px;
        }
        .input-area textarea {
            flex: 1;
            resize: none;
            border: 1px solid #e0e0e6;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            min-height: 44px;
            max-height: 120px;
        }
        .input-area textarea:focus { border-color: var(--primary); }
        .input-area button {
            padding: 0 22px;
            border: none;
            border-radius: 8px;
            background: var(--primary);
            color: #fff;
            font-size: 15px;
            cursor: pointer;
        }
        .input-area button:disabled { background: #b6c0f7; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">企业内部知识库问答助手</div>
        <div class="messages" id="messages"></div>
        <div class="input-area">
            <textarea id="input" placeholder="请输入您的问题..." rows="1"></textarea>
            <button id="send">发送</button>
        </div>
    </div>

    <script>
        let sessionId = null;
        const messages = document.getElementById("messages");
        const input = document.getElementById("input");
        const sendBtn = document.getElementById("send");

        function addMsg(text, role, sources) {
            const div = document.createElement("div");
            div.className = "msg " + role;
            div.textContent = text;
            if (sources && sources.length) {
                const s = document.createElement("div");
                s.className = "sources";
                s.textContent = "来源: " + sources.join(", ");
                div.appendChild(s);
            }
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }

        async function send() {
            const q = input.value.trim();
            if (!q) return;
            addMsg(q, "user");
            input.value = "";
            sendBtn.disabled = true;

            try {
                const resp = await fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ question: q, session_id: sessionId }),
                });
                const data = await resp.json();
                sessionId = data.session_id || sessionId;
                addMsg(data.answer, "bot", data.sources);
            } catch (e) {
                addMsg("请求失败，请稍后重试。", "bot");
            } finally {
                sendBtn.disabled = false;
                input.focus();
            }
        }

        sendBtn.addEventListener("click", send);
        input.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                send();
            }
        });

        addMsg("您好，我是企业内部知识库助手，请问有什么可以帮您？", "bot");
    </script>
</body>
</html>
