# 企业内部知识库问答机器人配置文件
# 说明：敏感凭证（API Key 等）优先通过环境变量注入，此处仅放非敏感项。

app:
  name: rag-kf-support
  env: dev            # dev / test / prod
  log_level: INFO
  host: 0.0.0.0
  port: 8000

# 向量库
vector_db:
  type: chroma        # chroma / milvus
  host: ""
  port: 0
  collection: "kf_knowledge"
  persist_dir: "data/chroma"

# Embedding 模型
# bge-small-zh-v1.5：约 95MB、512 维，轻量中文模型，CPU 可离线跑
embedding:
  provider: local     # local
  model: "BAAI/bge-small-zh-v1.5"
  dimension: 512
  device: cpu         # cpu / cuda

# LLM（留空 api_key 则走降级模式：返回检索片段原文）
# api_key 请通过环境变量 LLM_API_KEY 注入，勿明文提交到仓库
# 系统角色：调用 LLM 时 messages[0].role="system"，content 以该角色身份进行回复。
# 详见 README「LLM 调用 role 规范」一节。
llm:
  provider: deepseek  # deepseek / qwen / hunyuan
  api_key: ""         # 环境变量 LLM_API_KEY
  base_url: "https://api.deepseek.com"
  model: "deepseek-chat"
  temperature: 0.3
  timeout_seconds: 30
  system_role: "知识库助手"

# 管理员鉴权：保护 /kb/* 管理接口（上传/分片/入库/预览原文）。
# token 请通过环境变量 ADMIN_TOKEN 注入（或 .env），勿明文提交到仓库。
# 为空则关闭鉴权（仅建议本地开发使用）。
admin:
  token: ""  # 环境变量 ADMIN_TOKEN

# 检索
retrieval:
  top_k: 5
  threshold: 0.5      # 相似度低于阈值则判定未命中

# 合规
compliance:
  sensitive_words: ["底价", "内部", "员工", "领导", "报价单"]
  transfer_keywords: ["人工", "转人工", "投诉"]
  max_history_rounds: 10
