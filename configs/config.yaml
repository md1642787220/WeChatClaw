# 对外智能客服系统配置文件
# 说明：敏感凭证（secret 等）优先通过环境变量注入，此处仅放非敏感项。

app:
  name: rag-kf-support
  env: dev            # dev / test / prod
  log_level: INFO
  host: 0.0.0.0
  port: 8000

# 企业微信
wecom:
  corpid: ""          # 环境变量 WECOM_CORPID 优先
  secret: ""          # 环境变量 WECOM_SECRET 优先，严禁提交仓库
  agentid: 0
  # 微信客服回调配置
  callback:
    token: ""         # 环境变量 WECOM_CALLBACK_TOKEN
    encoding_aes_key: ""  # 环境变量 WECOM_CALLBACK_AES_KEY

# Redis（access_token 缓存、会话、幂等）
redis:
  url: "redis://localhost:6379/0"

# 向量库（M2 使用）
vector_db:
  type: chroma        # chroma / milvus
  host: ""
  port: 0
  collection: "kf_knowledge"

# Embedding 模型（M2 使用）
embedding:
  model: "BAAI/bge-m3"
  dimension: 1024

# LLM（M3 使用）
llm:
  provider: deepseek  # deepseek / qwen / hunyuan
  api_key: ""         # 环境变量 LLM_API_KEY
  base_url: "https://api.deepseek.com"
  model: "deepseek-chat"
  temperature: 0.3
  timeout_seconds: 30

# 合规（M4 使用）
compliance:
  sensitive_words: ["底价", "内部", "员工", "领导", "报价单"]
  transfer_keywords: ["人工", "转人工", "投诉"]
  max_answers_per_48h: 5
