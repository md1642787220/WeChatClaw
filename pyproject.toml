[project]
name = "rag-kf-support"
version = "0.1.0"
description = "企业内部知识库问答机器人（RAG）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "redis>=5.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# RAG / 知识库相关依赖（LangChain 模块化生态）
rag = [
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langchain-text-splitters>=1.0",
    "langchain-chroma>=1.0",
    "langchain-openai>=1.0",
    "langchain-community>=0.4",
    "langgraph>=1.0",
    "chromadb>=1.0",
    "sentence-transformers>=5.0",
]

dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

# 使用国内镜像源加速依赖下载（清华源）
[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
