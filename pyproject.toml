[project]
name = "rag-kf-support"
version = "0.1.0"
description = "企业自有知识库 + 微信客服对外智能客服系统"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "redis>=5.0",
]

[project.optional-dependencies]
# 知识库 / RAG 相关依赖（M2/M3 引入，骨架阶段暂不安装）
rag = [
    "pymilvus>=2.4",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "openai>=1.30",
]

dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
